<script>
(async function () {
  var A = window.IARPPS, main = document.getElementById("conteudo");
  if (!A.configurado) return A.avisoConfig(main);
  document.getElementById("sair").addEventListener("click", A.sair);

  var s = await A.sessaoAtual();
  if (!s || A.precisaTrocar(s)) return location.replace("index.html");
  document.getElementById("quem").textContent = s.user.email;
  A.ehAdmin().then(function (sim) { document.getElementById("link-admin").hidden = !sim; });

  // O conteúdo só vem do banco para e-mails autorizados (regra RLS).
  var r = await A.sb.from("course_pages").select("html").eq("slug", "curso").maybeSingle();
  if (r.error) {
    main.innerHTML = '<div class="center-state"><h2>Não foi possível carregar o curso</h2><p></p></div>';
    main.querySelector("p").textContent = A.traduzErro(r.error);
    return;
  }
  if (!r.data) {
    main.innerHTML = '<div class="center-state"><h2>Acesso não liberado</h2><p>O e-mail <strong></strong> não está na lista de participantes autorizados. Fale com o facilitador do curso.</p><p><button class="btn inline" type="button">Sair</button></p></div>';
    main.querySelector("strong").textContent = s.user.email;
    main.querySelector("button").addEventListener("click", A.sair);
    return;
  }
  main.innerHTML = r.data.html;
  document.getElementById("abas").hidden = false;
  A.iniciarCurso();
})();
</script>
